[package]
name = "rake-shim-bin"
version = "0.1.4-alpha.1"
# edition 2021 is REQUIRED, not a style choice: the vendored upstream source has
# `unsafe fn` bodies that call unsafe operations without an inner `unsafe { }`
# block. In edition 2024 the `unsafe_op_in_unsafe_fn` lint is deny-by-default,
# so the upstream file would not compile. Staying on 2021 also keeps the vendored
# file byte-identical to upstream, which makes future re-syncs a straight replace.
edition = "2021"
description = "Scoop-compatible shim binary, vendored from ScoopInstaller/Shim (rust/)"
license = "MIT OR Unlicense"

# Built as `shim.exe` so a locally built copy is a drop-in match for the binary
# scoop ships, which makes side-by-side debugging straightforward.
[[bin]]
name = "shim"
path = "src/main.rs"

# Deliberately absent: `[lints.rust] unsafe_code = "forbid"`.
# The upstream reference implementation is raw FFI throughout and cannot be made
# safe without rewriting it, which would defeat the point of vendoring it.

[lints.clippy]
# These fire on upstream's own code. They are suppressed rather than fixed
# because src/main.rs is kept byte-identical to upstream, so that a future
# re-sync is a straight file replace with no manual re-merging.
manual_repeat_n = "allow"           # upstream predates std::iter::repeat_n
collapsible_if = "allow"
unnecessary_mut_passed = "allow"

[dependencies.windows-sys]
version = "0.61"
features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_System_Console",
    "Win32_System_Diagnostics_Debug",
    "Win32_System_Environment",
    "Win32_System_IO",
    "Win32_System_JobObjects",
    "Win32_System_LibraryLoader",
    "Win32_System_Registry",
    "Win32_System_Threading",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
    "Win32_Storage_FileSystem",
]

# Upstream's `build.rs` (winres: icon + version resource) is intentionally not
# vendored — it adds a build dependency for cosmetics the shim does not need.
