name: Release

on:
  push:
    tags: ["v*.*.*"]

env:
  CARGO_TERM_COLOR: always

jobs:
  quality:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      # Both this and ci.yml track stable, so a release is built by the same
      # toolchain that checked it — as long as stable has not moved between the
      # two runs. Keep the local toolchain current; see AGENTS.md.
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      - name: Format check
        run: cargo fmt --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Test
        run: cargo test --workspace

  build:
    needs: quality
    strategy:
      fail-fast: false
      matrix:
        target:
          - x86_64-pc-windows-msvc
          - i686-pc-windows-msvc
          - aarch64-pc-windows-msvc
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: Build release binary
        run: cargo build --release --target ${{ matrix.target }}

      - name: Package archive
        shell: pwsh
        run: |
          $name = "rake-${{ matrix.target }}"
          $zip = "$name.zip"
          $src = "target/${{ matrix.target }}/release/rake.exe"
          if (-not (Test-Path $src)) {
            Write-Error "Build artifact not found: $src"
            exit 1
          }
          # Only the executable: `rake self install/update/uninstall` are implemented in
          # Rust, so releases no longer need to carry a bootstrap script. scripts/bootstrap.ps1
          # exists solely to fetch the very first binary and is not published in the archive.
          Compress-Archive -Path $src -DestinationPath $zip
          $hash = (Get-FileHash $zip -Algorithm SHA256).Hash.ToLower()
          Set-Content -Path "$zip.sha256" -Value "$hash  $zip"
          Write-Output "Packaged: $zip"

      - name: Upload target artifact
        uses: actions/upload-artifact@v7
        with:
          name: rake-${{ matrix.target }}
          path: |
            rake-*.zip
            rake-*.zip.sha256
          if-no-files-found: error

  publish:
    needs: build
    permissions:
      contents: write
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - name: Download packaged artifacts
        uses: actions/download-artifact@v8
        with:
          pattern: rake-*
          merge-multiple: true
          path: dist

      - name: Extract release notes for this tag
        shell: pwsh
        run: |
          # Take the section of CHANGELOG.md that matches the tag, so the release
          # body is the entry for this version rather than the whole history.
          $tag = "${{ github.ref_name }}"
          # Tags carry a `v`; the changelog headings do not.
          $version = $tag -replace '^v', ''

          # A tag that disagrees with the crate version would ship a binary whose
          # --version does not match the release it is filed under.
          #
          # Read from [workspace.package] in the root Cargo.toml, which is the
          # canonical version inherited across workspace crates.
          $workspaceManifest = "Cargo.toml"
          if (-not (Test-Path $workspaceManifest)) {
            Write-Error "cannot find $workspaceManifest"
            exit 1
          }
          $declared = (Select-String -Path $workspaceManifest -Pattern '^version = "(.+)"$' |
                       Select-Object -First 1).Matches[0].Groups[1].Value
          if ($declared -ne $version) {
            Write-Error "tag is $tag but $workspaceManifest says $declared"
            exit 1
          }

          $notes = "$env:RUNNER_TEMP\notes.md"
          $lines = Get-Content CHANGELOG.md

          $header = "## [$version]"
          $start = 0
          for ($i = 0; $i -lt $lines.Count; $i++) {
            if ($lines[$i].Trim() -eq $header) { $start = $i; break }
          }
          if ($start -eq 0) {
            Write-Error "CHANGELOG.md has no '$header' section, refusing to publish an empty body"
            exit 1
          }

          $section = [System.Collections.Generic.List[string]]::new()
          for ($i = $start + 1; $i -lt $lines.Count; $i++) {
            if ($lines[$i] -match '^## \[') { break }
            $section.Add($lines[$i])
          }

          $body = ($section -join "`n").Trim()
          if (-not $body) {
            Write-Error "section '$header' is empty"
            exit 1
          }
          Set-Content -Path $notes -Value $body -NoNewline
          Write-Output "Release notes: $($body.Length) chars from '$header'"

      - name: Upload release assets
        uses: softprops/action-gh-release@v3
        with:
          body_path: ${{ runner.temp }}/notes.md
          # So a v0.1.4-alpha.1 is listed as a pre-release instead of sitting in
          # the releases list as if it were the finished 0.1.4.
          prerelease: ${{ contains(github.ref_name, '-') }}
          fail_on_unmatched_files: true
          files: |
            dist/rake-*.zip
            dist/rake-*.zip.sha256
