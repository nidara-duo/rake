name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always

jobs:
  quality:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      # Tracks stable on purpose, so the build uses the same compiler the project is
      # developed against locally. The cost is that stable moves: 1.99 turned on
      # `single_element_loop` and failed `rake-core` over a loop that had been in
      # the tree since before the previous release, purely because the local
      # toolchain had not been updated. So `rustc --version` is part of the
      # pre-commit checklist — see AGENTS.md. If this line and the local version
      # disagree, run `rustup update stable` before committing, not after CI says so.
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Format check
        run: cargo fmt --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Test
        run: cargo test --workspace

      - name: Build
        run: cargo build --workspace
