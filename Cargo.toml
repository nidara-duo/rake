[workspace]
resolver = "2"
members = [
    "crates/rake-domain",
    "crates/rake-core",
    "crates/rake-cli",
    "crates/rake-hash",
    "crates/rake-shim-bin",
]
default-members = ["crates/rake-cli"]

[workspace.package]
version = "0.1.4-alpha.3"
edition = "2024"
license = "GPL-3.0-or-later"
repository = "https://github.com/nidara-duo/rake"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = "1"
thiserror = "2"
tracing = "0.1"
sha2 = "0.10"
sha1 = "0.10"
md5 = { package = "md-5", version = "0.10" }
hex = "0.4"
tempfile = "3"
crossterm = "0.29"
indicatif = "0.17"
